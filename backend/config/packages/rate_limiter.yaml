framework:
    rate_limiter:
        # Essais de mot de passe sur un fichier partagé : 5 par fenêtre de 15 minutes,
        # comptés par couple "lien + adresse IP". Au-delà : 429 (trop de tentatives).
        # Un essai réussi remet le compteur à zéro. Voir SharedFileController::unlock().
        file_unlock:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        # Envois de fichiers par un visiteur NON connecté : 10 par heure et par adresse IP.
        # Les utilisateurs connectés ne sont pas concernés. Voir FileController::create().
        anonymous_upload:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            anonymous_upload:
                # Le cache de test persiste entre deux exécutions : limite très haute pour ne pas bloquer les tests.
                limit: 100000
