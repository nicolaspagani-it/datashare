framework:
    rate_limiter:
        # Essais de mot de passe sur un fichier partagé : 5 par fenêtre de 15 minutes,
        # comptés par couple "lien + adresse IP". Au-delà : 429 (trop de tentatives).
        # Un essai réussi remet le compteur à zéro. Voir SharedFileController::unlock().
        file_unlock:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
